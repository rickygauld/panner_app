<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Night Planner</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --soft-coral: #F5B5A0;
  --soft-pink: #E8B4D4;
  --soft-blue: #B5D8F5;
  --soft-teal: #A0E5D8;
  --soft-yellow: #F5E5A0;
  --soft-purple: #D4C4F5;
  --soft-green: #C4E8B5;
  --bright-green: #5FD88F;
  --text-dark: #3D3D3D;
  --text-light: #7A7A7A;
  --border-soft: #E5E5E5;
  --lock-red: #E8A0A0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #FAFAFA 0%, #F0F8FF 50%, #FFF0F5 100%);
  color: var(--text-dark);
  padding: 16px;
  min-height: 100vh;
}

.container {
  max-width: 400px;
  margin: 0 auto;
}

.header {
  text-align: center;
  margin-bottom: 28px;
  padding-top: 12px;
}

.header h1 {
  font-size: 36px;
  font-weight: 600;
  color: var(--text-dark);
  margin-bottom: 8px;
  letter-spacing: 4px;
}

.header p {
  font-size: 14px;
  color: var(--text-light);
}

.form-section {
  background: rgba(255, 255, 255, 0.8);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  border: 1px solid var(--border-soft);
  backdrop-filter: blur(4px);
}

.section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dark);
  margin-bottom: 14px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #999;
}

.input-group {
  margin-bottom: 14px;
}

.input-group label {
  display: block;
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 6px;
}

input[type="text"],
input[type="number"] {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  font-size: 14px;
  background: rgba(255, 255, 255, 0.6);
  color: var(--text-dark);
  transition: all 0.2s;
}

input[type="text"]:focus,
input[type="number"]:focus {
  outline: none;
  border-color: var(--soft-blue);
  background: white;
  box-shadow: 0 0 0 3px rgba(181, 216, 245, 0.2);
}

.activity-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.activity-option {
  position: relative;
}

.activity-option input[type="checkbox"] {
  display: none;
}

.activity-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 14px 10px;
  border-radius: 12px;
  border: 2px solid var(--border-soft);
  cursor: pointer;
  transition: all 0.2s;
  background: rgba(255, 255, 255, 0.5);
  font-size: 12px;
  font-weight: 500;
  text-align: center;
}

.activity-option input[type="checkbox"]:checked + .activity-label {
  border-color: var(--soft-coral);
  background: var(--soft-coral);
  color: white;
}

.activity-icon {
  font-size: 28px;
  line-height: 1;
}

.dates-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 180px;
  overflow-y: auto;
}

.date-check {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
}

.date-check:hover {
  background: rgba(181, 216, 245, 0.1);
}

.date-check input[type="checkbox"] {
  cursor: pointer;
  width: 18px;
  height: 18px;
  accent-color: var(--soft-teal);
}

.date-check label {
  cursor: pointer;
  flex: 1;
  font-size: 13px;
}

.decline-section {
  position: relative;
  margin-top: 20px;
}

.decline-btn {
  width: 100%;
  padding: 14px;
  border: 2px solid #DDD;
  border-radius: 12px;
  background: #F9F9F9;
  color: var(--text-dark);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}

.decline-btn:hover:not(:disabled) {
  background: #F0F0F0;
  border-color: #BBB;
}

.decline-btn:disabled {
  cursor: not-allowed;
  opacity: 0.6;
}

.decline-btn.locked {
  border-color: var(--lock-red);
  background: rgba(232, 160, 160, 0.1);
}

.lock-icon {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
}

.decline-message {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 8px;
  padding: 10px;
  background: rgba(232, 160, 160, 0.15);
  border-radius: 8px;
  text-align: center;
  font-style: italic;
  min-height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.submit-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--soft-teal) 0%, var(--soft-blue) 100%);
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 12px rgba(160, 229, 216, 0.2);
}

.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(160, 229, 216, 0.3);
}

.submit-btn:active {
  transform: translateY(0);
}

.submit-btn.ready {
  background: linear-gradient(135deg, var(--bright-green) 0%, #4AC76F 100%);
  box-shadow: 0 4px 12px rgba(95, 216, 143, 0.3);
}

.submit-btn.ready:hover {
  box-shadow: 0 6px 16px rgba(95, 216, 143, 0.4);
}

.results-link-btn {
  width: 100%;
  padding: 12px;
  background: #F0F0F0;
  border: 1px solid #DDD;
  border-radius: 12px;
  color: var(--text-dark);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
}

.results-link-btn:hover {
  background: #E5E5E5;
  border-color: #BBB;
}

.thank-you-text {
  font-size: 12px;
  color: var(--bright-green);
  margin-top: 8px;
  font-weight: 500;
  display: none;
}

.thank-you-text.visible {
  display: block;
}

.results-container {
  display: none;
  text-align: center;
}

.results-btn-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin-top: 20px;
}

.thank-you-message {
  background: rgba(255, 255, 255, 0.9);
  border-radius: 16px;
  padding: 40px 20px;
  border: 1px solid var(--border-soft);
  margin-top: 20px;
}

.thank-you-message h2 {
  font-size: 32px;
  color: var(--bright-green);
  margin-bottom: 12px;
}

.thank-you-message p {
  font-size: 16px;
  color: var(--text-dark);
  line-height: 1.6;
}

.result-card {
  background: rgba(255, 255, 255, 0.9);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid var(--border-soft);
}

.result-card h3 {
  font-size: 13px;
  font-weight: 600;
  color: #999;
  text-transform: uppercase;
  margin-bottom: 10px;
  letter-spacing: 0.5px;
}

.votes {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.vote-badge {
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  background: var(--soft-coral);
  color: white;
}

.back-btn {
  background: #F0F0F0;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  margin-top: 20px;
  width: 100%;
}

.results-btn-group .back-btn {
  margin-top: 0;
  width: auto;
  min-width: 120px;
  margin: 0;
}

.back-btn:hover {
  background: #E5E5E5;
}

.reset-btn {
  background: transparent;
  border: none;
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 10px;
  font-weight: 400;
  margin-top: 12px;
  color: #DDD;
  transition: all 0.2s;
  opacity: 0.4;
  text-decoration: none;
}

.reset-btn:hover {
  color: var(--lock-red);
  background: rgba(232, 160, 160, 0.08);
  opacity: 1;
}

.error {
  color: var(--lock-red);
  font-size: 12px;
  margin-top: 4px;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎉🎉🎉🎉🎉</h1>
    <p>planning something fun</p>
  </div>

  <div id="formContainer">
    <div class="form-section">
      <div class="section-title">Your number</div>
      <div class="input-group">
        <input type="number" id="nameInput" placeholder="" min="0" max="9999999999">
        <div class="thank-you-text" id="thankYouText">thank you</div>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">What sounds fun?</div>
      <div class="activity-grid">
        <div class="activity-option">
          <input type="checkbox" id="dinner" name="activity" value="Dinner">
          <label for="dinner" class="activity-label">
            <span class="activity-icon">🍽️</span>
            Dinner
          </label>
        </div>
        <div class="activity-option">
          <input type="checkbox" id="drinks" name="activity" value="Drinks">
          <label for="drinks" class="activity-label">
            <span class="activity-icon">🍹</span>
            Drinks
          </label>
        </div>
        <div class="activity-option">
          <input type="checkbox" id="movie" name="activity" value="Movie">
          <label for="movie" class="activity-label">
            <span class="activity-icon">🎬</span>
            Movie
          </label>
        </div>
        <div class="activity-option">
          <input type="checkbox" id="excursion" name="activity" value="Excursion">
          <label for="excursion" class="activity-label">
            <span class="activity-icon">🌲</span>
            Excursion
          </label>
        </div>
        <div class="activity-option">
          <input type="checkbox" id="treat" name="activity" value="Treat">
          <label for="treat" class="activity-label">
            <span class="activity-icon">🍰</span>
            Treat
          </label>
        </div>
        <div class="activity-option">
          <input type="checkbox" id="other" name="activity" value="Something else">
          <label for="other" class="activity-label">
            <span class="activity-icon">✉️</span>
            Something else
          </label>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">When works for you?</div>
      <div class="dates-section" id="datesContainer"></div>
    </div>

    <div class="form-section">
      <div class="section-title">Hmm, not interested?</div>
      <button class="decline-btn" id="declineBtn" type="button">Can't make it</button>
      <div class="decline-message" id="declineMessage"></div>
    </div>

    <button class="submit-btn" id="submitBtn">Done Deal</button>
    <button class="results-link-btn" id="viewResultsBtn">View Results</button>
  </div>

  <div id="resultsContainer" class="results-container">
    <div class="thank-you-message" id="thankYouMessageBox">
      <h2>Thank you!</h2>
      <p>Your vote has been recorded.</p>
    </div>
    <div id="resultsContent"></div>
    <div class="results-btn-group">
      <button class="back-btn" id="backBtn">Back to form</button>
      <button class="reset-btn" id="resetBtn">reset</button>
    </div>
  </div>
</div>

<script>
const DECLINE_MESSAGES = [
  "I'm committed to my couch that night.",
  "My plants need me. They're very needy.",
  "Are you sure about that?",
  "Would you like to try again?",
  "That doesn't sound confident.",
];

let declineCount = 0;

function generateDateRange() {
  const start = new Date(2026, 8, 24);
  const end = new Date(2026, 9, 8);
  const dates = [];
  
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    dates.push(new Date(d));
  }
  return dates;
}

function initializeDates() {
  const datesContainer = document.getElementById('datesContainer');
  const dates = generateDateRange();
  
  dates.forEach((date, index) => {
    const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' });
    const checkbox = document.createElement('div');
    checkbox.className = 'date-check';
    checkbox.innerHTML = `
      <input type="checkbox" id="date-${index}" value="${date.toISOString().split('T')[0]}">
      <label for="date-${index}">${dateStr}</label>
    `;
    datesContainer.appendChild(checkbox);
  });
}

function showDeclineMessage() {
  const msg = DECLINE_MESSAGES[Math.floor(Math.random() * DECLINE_MESSAGES.length)];
  document.getElementById('declineMessage').textContent = msg;
}

document.getElementById('declineBtn').addEventListener('click', () => {
  declineCount++;
  showDeclineMessage();
  
  if (declineCount >= 5) {
    const btn = document.getElementById('declineBtn');
    btn.disabled = true;
    btn.classList.add('locked');
    btn.innerHTML = 'Can\'t make it <span class="lock-icon">🔒</span>';
  }
});

function checkFormCompletion() {
  const number = document.getElementById('nameInput').value.trim();
  const activities = Array.from(document.querySelectorAll('input[name="activity"]:checked'));
  const selectedDates = Array.from(document.querySelectorAll('.date-check input[type="checkbox"]:checked'));
  
  const isComplete = number.length === 10 && activities.length > 0 && selectedDates.length > 0;
  
  const submitBtn = document.getElementById('submitBtn');
  if (isComplete) {
    submitBtn.classList.add('ready');
  } else {
    submitBtn.classList.remove('ready');
  }
}

document.getElementById('nameInput').addEventListener('input', (e) => {
  const value = e.target.value.trim();
  const thankYouText = document.getElementById('thankYouText');
  
  if (value.length === 10) {
    thankYouText.classList.add('visible');
  } else {
    thankYouText.classList.remove('visible');
  }
  
  checkFormCompletion();
});


document.getElementById('backBtn')?.addEventListener('click', () => {
  location.reload();
});

// Define showResults as a placeholder - will be overridden by Firebase version
let showResults = async function(showThankYou = false) {
  console.log('showResults called');
};

initializeDates();

// Add event listeners for activities and dates after they're created
document.querySelectorAll('input[name="activity"]').forEach(checkbox => {
  checkbox.addEventListener('change', checkFormCompletion);
});

document.querySelectorAll('.date-check input[type="checkbox"]').forEach(checkbox => {
  checkbox.addEventListener('change', checkFormCompletion);
});
</script>

<!-- Firebase Scripts (Compat Version) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
// Firebase Configuration
const firebaseConfig = {
  apiKey: "AIzaSyA2bcnOZaSBaYFgqVFjHBJMlitZJ_FI3XI",
  authDomain: "planner-app-99aa3.firebaseapp.com",
  projectId: "planner-app-99aa3",
  storageBucket: "planner-app-99aa3.firebasestorage.app",
  messagingSenderId: "377968852763",
  appId: "1:377968852763:web:b7dec6050cbfa33d22ddbe"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Save vote to Firestore instead of localStorage
async function saveVoteToFirebase(vote) {
  try {
    await db.collection('votes').add(vote);
    console.log('Vote saved to Firebase');
  } catch (error) {
    console.error('Error saving vote:', error);
    alert('Error saving vote. Please try again.');
  }
}

// Load all votes from Firestore
async function loadVotesFromFirebase() {
  try {
    const snapshot = await db.collection('votes').get();
    const allVotes = [];
    snapshot.forEach(doc => {
      allVotes.push(doc.data());
    });
    return allVotes;
  } catch (error) {
    console.error('Error loading votes:', error);
    return [];
  }
}

// Update showResults to use Firebase data
showResults = async function(showThankYou = false) {
  document.getElementById('formContainer').style.display = 'none';
  document.getElementById('resultsContainer').style.display = 'block';
  
  if (!showThankYou) {
    document.getElementById('thankYouMessageBox').style.display = 'none';
  }
  
  const allVotes = await loadVotesFromFirebase();
  
  const activityCounts = {};
  const dateCounts = {};
  
  allVotes.forEach(vote => {
    const activities = Array.isArray(vote.activities) ? vote.activities : [vote.activity];
    activities.forEach(activity => {
      activityCounts[activity] = (activityCounts[activity] || 0) + 1;
    });
    vote.dates.forEach(date => {
      dateCounts[date] = (dateCounts[date] || 0) + 1;
    });
  });
  
  const resultsContent = document.getElementById('resultsContent');
  resultsContent.innerHTML = '';
  
  const activityCard = document.createElement('div');
  activityCard.className = 'result-card';
  activityCard.innerHTML = `
    <h3>Activity votes</h3>
    <div class="votes">
      ${Object.entries(activityCounts)
        .sort((a, b) => b[1] - a[1])
        .map(([activity, count]) => `<div class="vote-badge">${activity} (${count})</div>`)
        .join('')}
    </div>
  `;
  resultsContent.appendChild(activityCard);
  
  const dateCard = document.createElement('div');
  dateCard.className = 'result-card';
  dateCard.innerHTML = `
    <h3>Best dates</h3>
    <div class="votes">
      ${Object.entries(dateCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([date, count]) => {
          const d = new Date(date + 'T00:00:00');
          const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' });
          return `<div class="vote-badge">${dateStr} (${count})</div>`;
        })
        .join('')}
    </div>
  `;
  resultsContent.appendChild(dateCard);
  
  const peopleCard = document.createElement('div');
  peopleCard.className = 'result-card';
  peopleCard.innerHTML = `
    <h3>Contact</h3>
    <div class="votes">
      ${allVotes.map(v => `<div class="vote-badge">${v.number}</div>`).join('')}
    </div>
  `;
  resultsContent.appendChild(peopleCard);
};

// Update submit button to use Firebase
document.getElementById('submitBtn').addEventListener('click', async (e) => {
  e.preventDefault();
  console.log('Submit button clicked');
  
  const number = document.getElementById('nameInput').value.trim();
  console.log('Number:', number);
  
  if (number.length !== 10) {
    console.log('Number not 10 digits');
    return;
  }
  
  const activities = Array.from(document.querySelectorAll('input[name="activity"]:checked'))
    .map(cb => cb.value);
  console.log('Activities:', activities);
  
  if (activities.length === 0) {
    console.log('No activities selected');
    return;
  }
  
  const selectedDates = Array.from(document.querySelectorAll('.date-check input[type="checkbox"]:checked'))
    .map(cb => cb.value);
  console.log('Dates:', selectedDates);
  
  if (selectedDates.length === 0) {
    console.log('No dates selected');
    return;
  }
  
  const vote = {
    number,
    activities,
    dates: selectedDates,
    timestamp: new Date().toISOString()
  };
  
  console.log('Saving vote:', vote);
  await saveVoteToFirebase(vote);
  console.log('Vote saved, showing results');
  await showResults(true);
  console.log('Results displayed');
});

// Update View Results button to use Firebase
document.getElementById('viewResultsBtn')?.addEventListener('click', async () => {
  await showResults(false);
});
</script>

</body>
</html>
